[project]
name = "bundyclock"
version = "1.5.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "configparser==7.1.0",
    "dbus-python==1.3.2 ; sys_platform == 'linux'",
    "jinja2>=3.0.3",
    "pillow==12.1.1",
    "pygobject==3.44.1 ; sys_platform == 'linux'",
    "pyobjc==11.0 ; sys_platform == 'darwin'",
    "pystray==0.19.5",
    "python-dateutil>=2.8.2",
    "requests>=2.26.0",
    "wmi==1.5.1 ; sys_platform == 'win32'",
]

[project.scripts]
bundyclock = "bundyclock.bundyclock:main"

# Include your package data
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
bundyclock = ["service_files/*', 'templates/*"]

# Optional metadata
[project.urls]
Homepage = "https://github.com/dahallgren/bundyclock"